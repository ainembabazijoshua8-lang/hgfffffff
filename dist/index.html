    <!-- Leaflet Interactive Maps — SELF-HOSTED.
         These files were fetched from the previously SRI-pinned CDN URLs and
         their SHA-256 digests verified byte-identical to the integrity values
         that were already in this file, so the vendored copy is provably the
         same artefact. See public/vendor/leaflet-1.9.4/.

         Why self-hosted rather than CDN:
           - no third-party connection in the critical rendering path, on any page;
           - served from our own origin under /assets with a 1-year immutable
             cache, so repeat visits cost nothing;
           - no visitor IP/referrer is disclosed to unpkg on every page load;
           - lets script-src drop back to 'self' entirely.

         `defer` is safe and necessary: as a plain classic script this ~148KB
         file was render-blocking on EVERY route, including pages that never
         mount a map (/privacy, /terms, /faq, /blog/:slug). SafariMap.jsx polls
         window.L every 100ms with an 8s deadline and initialises as soon as L
         appears, so deferring cannot race it.

         The stylesheet stays render-blocking. The usual async-CSS trick
         (media="print" onload="this.media='all'") needs an inline event
         handler, which this app's own CSP forbids (script-src-attr 'none').
         Same-origin means it is now a local fetch rather than a third-party
         round trip. Leaflet's relative image/ URLs resolve under
         public/vendor/leaflet-1.9.4/images/. -->
    <link rel="stylesheet" href="/vendor/leaflet-1.9.4/leaflet.css" />
    <script defer src="/vendor/leaflet-1.9.4/leaflet.js"></script>
